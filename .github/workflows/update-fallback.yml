name: Update fallback values

on:
  schedule:
    # 1. den v mesici, 06:00 UTC (07:00 CET / 08:00 CEST)
    - cron: "0 6 1 * *"
  workflow_dispatch:  # umoznuje rucni spusteni z Actions tabu

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run update script
        run: python scripts/update_fallback.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status -s)" ]]; then
            git add index.html
            git commit -m "chore: monthly fallback update ($(date +%Y-%m-%d))"
            git push
            echo "Changes pushed"
          else
            echo "No changes to commit"
          fi
